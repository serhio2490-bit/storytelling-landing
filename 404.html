<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Страницы нет · Красная нить</title>
    <meta name="theme-color" content="#0B0E16" />

    <!-- ВНИМАНИЕ К ПУТЯМ.
         Эту страницу GitHub Pages отдаёт по ЛЮБОМУ несуществующему
         адресу, в том числе вложенному: /storytelling-landing/a/b/нет.
         Относительный путь к шрифтам оттуда указал бы в /a/b/fonts/,
         и буквы молча уехали бы в системный шрифт. Поэтому пути
         абсолютные и начинаются с имени репозитория.

         СМЕНИТСЯ АДРЕС САЙТА — поправить их здесь, иначе сломается
         только эта страница и только на боевом. Локально заметить
         нечем. -->

    <link
      rel="icon"
      href="/storytelling-landing/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="icon" href="/storytelling-landing/favicon.ico" sizes="32x32" />

    <style>
      /* Шрифты те же, что на сайте, и подрезаны так же. Кириллический
         поднабор не содержит ни точки, ни запятой (они в латинском
         диапазоне U+0020-007E), поэтому нужны оба файла на каждое
         семейство — иначе знаки препинания уедут в системный шрифт. */
      @font-face {
        font-family: "Oranienbaum";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/storytelling-landing/fonts/oranienbaum-400-cyr.woff2")
          format("woff2");
        unicode-range: U+0020, U+00A0, U+0401, U+0410-044F, U+0451, U+2116;
      }
      @font-face {
        font-family: "Oranienbaum";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/storytelling-landing/fonts/oranienbaum-400-lat.woff2")
          format("woff2");
        unicode-range:
          U+0020-007E, U+00A0, U+2013-2014, U+2018-2019, U+201C-201E, U+2026;
      }
      @font-face {
        font-family: "Golos Text";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/storytelling-landing/fonts/golos-400-cyr.woff2")
          format("woff2");
        unicode-range:
          U+0020, U+0041, U+00A0, U+0401, U+0410-044F, U+0451, U+2116;
      }
      @font-face {
        font-family: "Golos Text";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/storytelling-landing/fonts/golos-400-lat.woff2")
          format("woff2");
        unicode-range:
          U+0020-007E, U+00A0, U+2013-2014, U+2018-2019, U+201C-201E, U+2026;
      }

      /* Токены — те же значения, что в :root главной страницы.
         Ниже по файлу цветовых литералов нет. */
      :root {
        --canvas: #0b0e16;
        --text: #ede9e2;
        --muted: #a2aabc;
        --accent: #e23a4e;
        --accent-hover: #f04c5f;
        --line: #222b3e;

        --accent-rgb: 226 58 78;
        --heroglow-rgb: 52 26 34;

        --display: Oranienbaum, Georgia, serif;
        --body: "Golos Text", "Segoe UI", system-ui, sans-serif;

        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --tap: 44px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        background: var(--canvas);
        color: var(--text);
        font-family: var(--body);
        display: grid;
        place-items: center;
        padding: 40px clamp(20px, 5vw, 40px);
        position: relative;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Тёплое пятно — то же, что стоит позади заголовка на главной. */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          60% 50% at 70% 40%,
          rgb(var(--heroglow-rgb) / 0.9),
          transparent 70%
        );
        pointer-events: none;
      }

      /* Обрыв нити. На главной нить идёт сверху вниз слева; здесь она
         обрывается — ровно то, что случилось с адресом. */
      .strand {
        position: absolute;
        left: clamp(13px, 4vw, 34px);
        top: 0;
        width: 1px;
        height: 46%;
        background: linear-gradient(
          to bottom,
          rgb(var(--accent-rgb) / 0.75),
          rgb(var(--accent-rgb) / 0)
        );
      }

      .strand::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 5px;
        height: 5px;
        margin-left: -2.5px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 14px 2px rgb(var(--accent-rgb) / 0.55);
      }

      main {
        position: relative;
        max-width: 30rem;
      }

      .kicker {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .kicker::before {
        content: "";
        width: 26px;
        height: 1px;
        background: var(--accent);
        flex: none;
      }

      h1 {
        font-family: var(--display);
        font-weight: 400;
        font-size: clamp(40px, 8vw, 68px);
        line-height: 1;
        letter-spacing: -0.015em;
        margin-bottom: 22px;
      }

      p {
        color: var(--muted);
        font-size: 17px;
        line-height: 1.6;
        margin-bottom: 34px;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: var(--tap);
        padding: 0 26px;
        border: 1px solid var(--line);
        border-radius: 2px;
        color: var(--text);
        text-decoration: none;
        font-size: 15px;
        transition:
          border-color 0.35s var(--ease-out),
          color 0.35s var(--ease-out);
      }

      a:hover,
      a:focus-visible {
        border-color: var(--accent);
        color: var(--accent-hover);
      }

      a:focus-visible {
        outline: 1.6px solid var(--accent-hover);
        outline-offset: 2.4px;
      }
    </style>
  </head>

  <body>
    <span class="strand" aria-hidden="true"></span>

    <main>
      <p class="kicker">Красная нить</p>
      <h1>Здесь нить обрывается</h1>
      <p>
        Такой страницы на сайте нет. Либо адрес набран с ошибкой, либо ссылка,
        по которой вы пришли, устарела.
      </p>
      <a href="/storytelling-landing/">Вернуться на главную</a>
    </main>
  </body>
</html>
